telemetry = false
logLevel = "warn"

[console]
depth = 10

[install]
auto = "disable"
minimumReleaseAge = "3d"
ignore-scripts = true
exact = true

[run]
bun = true
shell = "bun"
silent = false
noOrphans = true

[fmt]
printWidth = 100
useTabs = true
sortPackageJson = { sortScripts = true }

[fmt.sortImports]
groups = [
	["builtin", "bun"],
	"external",
	"internal",
	["parent", "sibling", "index", "subpath"],
	["style", "side_effect_style", "side_effect"],
	"unknown",
]
customGroups = [{ groupName = "bun", elementNamePattern = ["bun", "bun:*", "bun:*/*"] }]
ignoreCase = false
